name: Linkspector
on: 
  workflow_dispatch:
  push:
  pull_request:
    branches: [ develop ]

jobs:
  check-links:
    name: runner / linkspector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run linkspector
        uses: umbrelladocs/action-linkspector@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: local
          fail_level: any
