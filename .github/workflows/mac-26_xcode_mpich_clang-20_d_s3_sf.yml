name: mac-26 xcode mpich clang-20 d s3 sf

on:
  push:
    branches: develop


jobs:
  build:
    name: mac-26 xcode mpich clang-20 d s3 sf
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: brew install libaec mpich aws-c-s3

      - name: Test HDF5
        run: |
          export CC=$(brew --prefix llvm@20)/bin/clang
          echo $CC
          mkdir build
          cd build
          cmake \
            -DHDF5_BUILD_FORTRAN:BOOL=OFF \
            -DHDF5_ENABLE_PARALLEL:BOOL=ON \
            -DHDF5_ENABLE_ROS3_VFD:BOOL=ON \
            -DHDF5_ENABLE_SUBFILING_VFD:BOOL=ON \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
            -DMPIEXEC_MAX_NUMPROCS:STRING=3 \
            -G Xcode ..
          cmake --build . --config Debug
          ctest --test-dir . -C Debug -E MPI_TEST_H5DIFF-h5diff -VV
          sudo cmake -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_CONFIG_NAME=Debug  -P cmake_install.cmake
