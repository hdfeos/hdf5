name: lin gcc_min

on:
  workflow_dispatch:
  push:
    branches: develop  

jobs:
  gcc_min:
    name: lin gcc_min
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y mingw-w64 mingw-w64-tools wine64 winbind wine-binfmt binfmt-support
          # Most tests run the .exe directly (add_test COMMAND $<TARGET_FILE:...>
          # does not get the cross-compiling emulator), so register Wine with
          # binfmt_misc; ubuntu-26.04 no longer does this with wine64 alone.
          sudo update-binfmts --import /usr/share/binfmts/wine || true
          update-binfmts --display wine || true
      - name: Get Source
        uses: actions/checkout@v4.1.1
      - name: Test HDF5
        run: |
          mkdir build
          cd build
          cmake --toolchain ../config/toolchain/mingw64.cmake \
          -DCMAKE_CROSSCOMPILING_EMULATOR:PATH=$GITHUB_WORKSPACE/config/toolchain/mingw-w64-x86-64-wine.sh \
          -DBUILDNAME:STRING=gcc_min \
          -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
          -DSITE:STRING=lin \
           ..
          ctest -T Build
          # Shared-library tests run under Wine and need MinGW's runtime DLLs
          # (libgcc, libstdc++, libwinpthread) on Wine's search path.
          export WINEPATH="$(dirname "$(x86_64-w64-mingw32-gcc -print-libgcc-file-name)");/usr/x86_64-w64-mingw32/lib"
          export WINEDEBUG=-all
          echo "WINEPATH=$WINEPATH"
          ctest -R "^H5TEST-testhdf5-base$" --output-on-failure || true
          ctest -T Test
