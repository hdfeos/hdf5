name: ompi

on:
  push:
    branches:
      - develop

jobs:
  test:
    name: ompi
    runs-on: ubuntu-latest
    steps:
      - name: get
        uses: actions/checkout@v4
        with:
          repository: hdfeos/hdf5
          path: .

      - name: test
        uses: cross-platform-actions/action@v1.7.0
        env:
          FOO: A
          BAR: B
        with:
          environment_variables: FOO BAR
          operating_system: openbsd
          architecture: x86-64
          version: '8.0'
          shell: bash
          run: |
            sudo pkg_add cmake
            sudo pkg_add openmpi
            export NPROCS=2
            mkdir build
            cd build
            cmake -DBUILDNAME:STRING=ompi \
            -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
            -DHDF5_ENABLE_PARALLEL:BOOL=ON \
            -DMPIEXEC_PREFLAGS="-oversubscribe" \
            -DSITE:STRING=obsd \
            ..
            ctest -T Build
            # testphdf5 fails under Open MPI's default ompio here (as on
            # Cygwin); use ROMIO for MPI-IO and show failing test output.
            ompi_info | grep "MCA io" || true
            # t_bigio and t_2Gio allocate more than 2 GiB, but OpenBSD's login
            # classes cap the data segment. Lift the datasize limits in
            # login.conf and run the tests in a fresh login shell.
            sudo sed -i -E 's/datasize(-max|-cur)?=[^:]*/datasize\1=infinity/g' /etc/login.conf
            grep datasize /etc/login.conf | sort -u
            if [ -f /etc/login.conf.db ]; then sudo cap_mkdb /etc/login.conf; fi
            sudo su -l runner -c "cd $PWD && ulimit -d \$(ulimit -H -d) && echo datasize=\$(ulimit -d) && OMPI_MCA_io=^ompio ctest -T Test --output-on-failure"
