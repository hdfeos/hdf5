name: ompi

on:
  push:
    branches:
      - develop

jobs:
  test:
    name: ompi
    runs-on: ubuntu-latest
    steps:
      - name: get
        uses: actions/checkout@v4
        with:
          repository: hdfeos/hdf5
          path: .

      - name: test
        uses: cross-platform-actions/action@v1.7.0
        env:
          FOO: A
          BAR: B
        with:
          environment_variables: FOO BAR
          operating_system: openbsd
          architecture: x86-64
          version: '8.0'
          shell: bash
          run: |
            sudo pkg_add cmake
            sudo pkg_add openmpi
            export NPROCS=2
            mkdir build
            cd build
            cmake -DBUILDNAME:STRING=ompi \
            -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
            -DHDF5_ENABLE_PARALLEL:BOOL=ON \
            -DMPIEXEC_PREFLAGS="-oversubscribe" \
            -DSITE:STRING=obsd \
            ..
            ctest -T Build
            # testphdf5 fails under Open MPI's default ompio here (as on
            # Cygwin); use ROMIO for MPI-IO and show failing test output.
            ompi_info | grep "MCA io" || true
            # t_bigio and t_2Gio allocate more than 2 GiB, but OpenBSD's default
            # login class caps the data segment at 1.5 GiB. Move runner to the
            # staff class (datasize-max=infinity) and run the tests in a fresh
            # login shell with the limit raised.
            sudo usermod -L staff runner
            sudo su -l runner -c "cd $PWD && ulimit -d unlimited && echo datasize=\$(ulimit -d) && OMPI_MCA_io=^ompio ctest -T Test --output-on-failure"
