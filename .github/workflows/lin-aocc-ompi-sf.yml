name: lin ompi aocc sf
on:
  push:
    branches:
      - develop
jobs:
  aocc_build_and_test:
    name: lin  ompi aocc sf
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install
        run: |
          sudo apt update
          sudo apt install -y libaec-dev ninja-build
          sudo apt install -y doxygen libncurses-dev libquadmath0 libstdc++6 libxml2
          sudo apt install -y zlib1g-dev libcurl4-openssl-dev libjpeg-dev wget curl bzip2
          sudo apt install -y m4 flex bison cmake libzip-dev openssl build-essential

      - name: aocc
        shell: bash
        run: |
          wget https://download.amd.com/developer/eula/aocc/aocc-5-0/aocc-compiler-5.0.0.tar
          tar -xvf aocc-compiler-5.0.0.tar
          cd aocc-compiler-5.0.0
          bash install.sh
          source /home/runner/work/hdf5/hdf5/setenv_AOCC.sh
          which clang
          which flang
          clang -v

      - name: cache
        id: cache-openmpi-5_0_8
        uses: actions/cache@v4
        with:
          path: /home/runner/work/hdf5/hdf5/openmpi-5.0.8-install
          key: ${{ runner.os }}-${{ runner.arch }}-openmpi-5_0_8-cache

      - name: ompi
        if: ${{ steps.cache-openmpi-5_0_8.outputs.cache-hit != 'true' }}
        run: |
          export LD_LIBRARY_PATH=/home/runner/work/hdf5/hdf5/aocc-compiler-5.0.0/lib:/usr/local/lib
          wget https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.8.tar.gz
          tar zxvf openmpi-5.0.8.tar.gz
          cd openmpi-5.0.8
          ./configure CC=/home/runner/work/hdf5/hdf5/aocc-compiler-5.0.0/bin/clang FC=/home/runner/work/hdf5/hdf5/aocc-compiler-5.0.0/bin/flang --prefix=/home/runner/work/hdf5/hdf5/openmpi-5.0.8-install
          make
          make install

      - name: test
        run: |
          export LD_LIBRARY_PATH=/home/runner/work/hdf5/hdf5/aocc-compiler-5.0.0/lib:/home/runner/work/hdf5/hdf5/openmpi-5.0.8-install/lib:/usr/local/lib
          export LD_RUN_PATH=/home/runner/work/hdf5/hdf5/aocc-compiler-5.0.0/lib:/home/runner/work/hdf5/hdf5/openmpi-5.0.8-install/lib:/usr/local/lib
          export PATH=/home/runner/work/hdf5/hdf5/openmpi-5.0.8-install/bin:/usr/local/bin:$PATH
          mkdir build
          cd build
          CC=mpicc \
          cmake -C $GITHUB_WORKSPACE/config/cmake/cacheinit.cmake -G Ninja \
            -DBUILDNAME:STRING="ninja/r/ompi-5.0.8/aocc-5.0.0/np=2/sf" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
            -DHDF5_BUILD_FORTRAN:BOOL=OFF \
            -DHDF5_BUILD_JAVA:BOOL=OFF \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
            -DHDF5_ENABLE_PARALLEL:BOOL=ON \
            -DHDF5_ENABLE_SUBFILING_VFD:BOOL=ON \
            -DHDF5_BUILD_CPP_LIB:BOOL=OFF \
            -DLIBAEC_USE_LOCALCONTENT=OFF \
            -DMPIEXEC_MAX_NUMPROCS:STRING="2" \
            -DSITE:STRING=ubu \
            -DZLIB_USE_LOCALCONTENT=OFF \
            ..
#          ctest -D Experimental
