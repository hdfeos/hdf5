name: lin nvhpc d

on:
  workflow_dispatch:
  push:
    branches: develop
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - 'doc/**'
      - 'release_docs/**'
      - 'ACKNOWLEDGEMENTS'
      - 'COPYING**'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.sha || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: install
        run: |
          sudo apt update
          sudo apt install -y cmake libzip-dev
      - name: free
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          tool-cache: false
          swap-storage: true
      - name: nvhpc
        run: |
          curl https://developer.download.nvidia.com/hpc-sdk/ubuntu/DEB-GPG-KEY-NVIDIA-HPC-SDK | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg] https://developer.download.nvidia.com/hpc-sdk/ubuntu/amd64 /' | sudo tee /etc/apt/sources.list.d/nvhpc.list
          sudo apt-get update -y
          sudo apt-get install -y nvhpc-25-7
      - name: get
        uses: actions/checkout@v4
      - name: test
        env:
          FC: nvfortran
          CC: nvc
          CFLAGS: -fPIC -O0
          FCFLAGS: -fPIC -O0
        run: |
          export NVHPCSDK=/opt/nvidia/hpc_sdk
          export OMPI_CXX=/opt/nvidia/hpc_sdk/Linux_x86_64/25.7/compilers/bin/nvc++
          export OMPI_CC=/opt/nvidia/hpc_sdk/Linux_x86_64/25.7/compilers/bin/nvc
          export OMPI_FC=/opt/nvidia/hpc_sdk/Linux_x86_64/25.7/compilers/bin/nvfortran
          export LD_LIBRARY_PATH=/opt/nvidia/hpc_sdk/Linux_x86_64/25.7/compilers/lib:/opt/nvidia/hpc_sdk/Linux_x86_64/25.7/cuda/12.9/lib64
          export PATH=/opt/nvidia/hpc_sdk/Linux_x86_64/25.7/comm_libs/openmpi4/bin:/opt/nvidia/hpc_sdk/Linux_x86_64/25.7/compilers/bin:$PATH        
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure
