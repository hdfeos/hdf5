name: lin gcc_arm64

on:
  workflow_dispatch:
  push:
    branches: develop
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install gcc-aarch64
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        sudo apt-get install -y binfmt-support qemu-user qemu-user-binfmt
    - name: Get Sources
      uses: actions/checkout@v4.1.1
    - name: Build and Test
      env:
        QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
      run: |
        aarch64-linux-gnu-gcc --version
        mkdir build
        cd build
        cmake -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_AR=/usr/bin/aarch64-linux-gnu-ar -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF ..
        make -j4
        make test
