name: mac-26 mpich clang-15 r f sf

on:
  workflow_dispatch:
  push:
    branches: develop
jobs:
  build:
    name: mac-26 mpich clang-15 r f sf
    runs-on: macos-26

    steps:
      - name: checkout
        uses: actions/checkout@v4.1.1
      - name: get
        run: |
          curl -O -L  https://github.com/macports/macports-base/releases/download/v2.11.5/MacPorts-2.11.5-13-Ventura.pkg
      - name: install
        run: |
          brew install flang ninja
          sudo installer -pkg MacPorts-2.11.5-26-Tahoe.pkg -target /
      - name: update
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          ls -l /opt/local/bin
          ls -l /opt/local/sbin
          sudo port selfupdate
      - name: mpich
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH          
          port version
          sudo port install mpich-clang17
          sudo port select --set mpi mpich-clang17-fortran
      - name: test
        run: |
          mkdir build
          cd build
          cmake -G Ninja \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_TOOLCHAIN_FILE="config/toolchain/clang.cmake" \
            -DHDF5_BUILD_JAVA:BOOL=ON \
            -DHDF5_BUILD_FORTRAN:BOOL=ON \
            -DHDF5_BUILD_HL_LIB:BOOL=ON \
            -DHDF5_ENABLE_ALL_WARNINGS=ON \
            -DHDF5_ENABLE_PARALLEL:BOOL=ON \
            -DHDF5_ENABLE_THREADSAFE:BOOL=OFF \
            -DHDF5_ENABLE_SUBFILING_VFD:BOOL=ON \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
            -DMPIEXEC_MAX_NUMPROCS:STRING=3 \
            ..
          ctest -T Build
          ctest -C Release -T Test         
