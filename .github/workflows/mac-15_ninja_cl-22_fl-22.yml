name: mac-15 ninja cl-22 fl-22

on:
  push:
    branches: develop
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: install
        run: |
          brew update
          brew install flang
      - name: checkout
        uses: actions/checkout@v5.0.0
      - name: test
        run: |
          ls /opt/homebrew/bin/flang*
          export FC=/opt/homebrew/bin/flang-22
          export CC=/opt/homebrew/Cellar/llvm/22.1.0/bin/clang
          export CXX=/opt/homebrew/Cellar/llvm/22.1.0/bin/clang++
          mkdir build
          cd build
          cmake -G Ninja \
            -DSITE:STRING=mac-15 \
            -DBUILDNAME:STRING="ninja/cl-22/fl-22" \
            -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
            -DCTEST_DROP_LOCATION_INIT="/submit.php?project=HDF5" \
            -DHDF5_BUILD_FORTRAN=ON \
            ..
          ctest -D Experimental
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

