name: lin nvhpc f p sf

on:
  workflow_dispatch:
  push:
    branches: develop  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: install
        run: |
          sudo apt update
          sudo apt install -y libaec-dev zlib1g-dev automake autoconf libcurl4-openssl-dev libjpeg-dev wget curl bzip2 m4 flex bison cmake libzip-dev doxygen openssl libtool libtool-bin build-essential
      - name: free
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          tool-cache: false
          swap-storage: true          
      - name: nvhpc
        run: |
          curl https://developer.download.nvidia.com/hpc-sdk/ubuntu/DEB-GPG-KEY-NVIDIA-HPC-SDK | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg] https://developer.download.nvidia.com/hpc-sdk/ubuntu/amd64 /' | sudo tee /etc/apt/sources.list.d/nvhpc.list
          sudo apt-get update -y
          sudo apt-get install -y nvhpc-26-9
      - name: Get Sources
        uses: actions/checkout@v4
      - name: Test HDF5
        env:
          CFLAGS: -fPIC
          FCFLAGS: -fPIC
        run: |
          export CC=/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/comm_libs/mpi/bin/mpicc
          export FC=/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/comm_libs/mpi/bin/mpifort
          export NVHPCSDK=/opt/nvidia/hpc_sdk
          export OMPI_CXX=/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/compilers/bin/nvc++
          export OMPI_CC=/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/compilers/bin/nvc
          export OMPI_FC=/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/compilers/bin/nvfortran
          export LD_LIBRARY_PATH=$(ls -d /opt/nvidia/hpc_sdk/Linux_x86_64/26.9/cuda/1*/lib64 | tail -1):/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/compilers/lib
          export PATH=/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/comm_libs/mpi/bin:/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/compilers/bin:$PATH        
          cmake -B build -DHDF5_ENABLE_PARALLEL:BOOL=ON -DHDF5_BUILD_FORTRAN:BOOL=ON -DHDF5_ENABLE_SUBFILING_VFD:BOOL=ON
          cat build/CMakeCache.txt
          cmake --build build
          ctest --test-dir build --output-on-failure
