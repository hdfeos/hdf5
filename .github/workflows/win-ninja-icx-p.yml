name: win ninja icx p

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: ninja
        uses: lukka/get-cmake@latest
      - name: msvc
        uses: ilammy/msvc-dev-cmd@v1
      - name: install oneAPI icx ifx
        shell: cmd
        run: |
          curl.exe -L --retry 5 --retry-delay 5 --output %TEMP%\oneapi.exe --url https://registrationcenter-download.intel.com/akdlm/IRC_NAS/728c4418-1b40-47a9-ad51-31530fb27c94/intel-oneapi-toolkit-2026.2.0.661_offline.exe
          start /b /wait %TEMP%\oneapi.exe -s -x -f %TEMP%\oneapi_extracted --log extract.log
          %TEMP%\oneapi_extracted\bootstrapper.exe -s --action install --components=intel.oneapi.win.cpp-dpcpp-common:intel.oneapi.win.ifort-compiler --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=.
          if errorlevel 1 exit /b 1
          rd /s/q %TEMP%\oneapi_extracted
      - name: mpi
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: intelmpi
      - name: checkout
        uses: actions/checkout@v4
      - name: test
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\mpi\latest\env\vars.bat"
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_C_COMPILER=icx -DCMAKE_Fortran_COMPILER=ifx -DHDF5_ENABLE_PARALLEL:BOOL=ON -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF -DHDF5_ENABLE_Z_LIB_SUPPORT:BOOL=OFF ..
          ninja
          ninja test
