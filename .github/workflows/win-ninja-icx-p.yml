name: win ninja icx p

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: cmake
        uses: lukka/get-cmake@latest
      - name: llvm
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
      - name: oneapi
        uses: awvwgk/setup-fortran@main
        with:
          compiler: intel
          version: '2025.0'
      - name: mpi
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: intelmpi
      - name: checkout
        uses: actions/checkout@v4
      - name: set
        shell: cmd
        run: |
          "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          "C:\Program Files (x86)\Intel\oneAPI\mpi\latest\env\vars.bat"
      - name: test
        shell: cmd
        run: |
          cd hdf5
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_C_COMPILER="C:/Program Files (x86)/Intel/oneAPI/mpi/latest/bin/mpiicx.bat" -DCMAKE_Fortran_COMPILER="C:/Program Files (x86)/Intel/oneAPI/mpi/latest/bin/mpiifx.bat" -DHDF5_ENABLE_PARALLEL:BOOL=ON -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF -DHDF5_ENABLE_Z_LIB_SUPPORT:BOOL=OFF ..
          ninja
          ninja test
