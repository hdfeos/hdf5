name: mac ninja clang j ompi ts

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: brew
      run: brew install ninja openmpi libaec
    - name: get
      uses: actions/checkout@v4
    - name: test
      run: |
        mkdir build
        cd build
        cmake  -G Ninja -DCMAKE_TOOLCHAIN_FILE=config/toolchain/clang.cmake -DBUILD_SHARED_LIBS=ON -DHDF5_ENABLE_ALL_WARNINGS=ON -DHDF5_ENABLE_THREADSAFE:BOOL=ON -DHDF5_BUILD_HL_LIB:BOOL=OFF -DHDF5_ENABLE_PARALLEL:BOOL=ON -DHDF5_BUILD_CPP_LIB:BOOL=OFF -DHDF5_BUILD_FORTRAN:BOOL=OFF -DHDF5_BUILD_JAVA:BOOL=ON -DMPIEXEC_MAX_NUMPROCS:STRING=2 -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF ..
        cmake -T Build
        ctest -C Release -T Test
