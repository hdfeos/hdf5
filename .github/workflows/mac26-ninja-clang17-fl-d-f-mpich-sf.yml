name: mac-26 ninja d mpich cl fl sf

on:
  workflow_dispatch:
  push:
    branches: develop

jobs:
  build:
    name: mac-26 ninja d mpich cl fl sf
    runs-on: macos-26

    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: get
        run: |
          curl -O -L  https://github.com/macports/macports-base/releases/download/v2.11.5/MacPorts-2.11.5-13-Ventura.pkg
      - name: install
        run: |
          brew install flang
          sudo installer -pkg MacPorts-2.11.5-13-Ventura.pkg -target /
      - name: update
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          ls -l /opt/local/bin
          ls -l /opt/local/sbin
          sudo port selfupdate
      - name: mpich
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          port version
          sudo port install mpich-clang
          sudo port select --set mpi mpich-clang-fortran
      - name: test
        run: |
          mkdir build
          cd build
          cmake -G Ninja \
            -DCMAKE_C_COMPILER=mpicc-mpich-clang -DCMAKE_Fortran_COMPILER=mpifort-mpich-clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_STATIC_EXECS:BOOL=OFF \
            -DBUILD_STATIC_LIBS:BOOL=OFF \
            -DCMAKE_TOOLCHAIN_FILE= config/toolchain/clang.cmake \
            -DHDF5_BUILD_FORTRAN=ON \
            -DHDF5_ENABLE_ALL_WARNINGS=ON \
            -DHDF5_ENABLE_PARALLEL:BOOL=ON \
            -DHDF5_ENABLE_SUBFILING_VFD:BOOL=ON \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
            -DMPIEXEC_MAX_NUMPROCS:STRING=3 \
            ..
          ctest -T Build
          ctest -C Release -T Test
