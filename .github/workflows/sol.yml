name: sol

on:
  push:
    branches: develop

defaults:
  run:
    shell: bash
jobs:
  build:
    name: solaris-gcc
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: test
        uses: vmactions/solaris-vm@v1
        with:
          release: "11.4-gcc"
          usesh: true
          copyback: false
          run: |
            gcc --version
            g++ --version
            cmake --version
            # HDF5 needs CMake >= 3.26; the Solaris package is older, so build a current one.
            curl -sSL -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.10/cmake-3.31.10.tar.gz
            (cd /tmp && gtar xzf cmake.tar.gz && cd cmake-3.31.10 && ./bootstrap --parallel=4 --prefix=/tmp/cmake -- -DCMAKE_USE_OPENSSL=OFF -DBUILD_TESTING=OFF > /tmp/cmake-bootstrap.log 2>&1 || { tail -50 /tmp/cmake-bootstrap.log; exit 1; }; gmake -j4 install > /tmp/cmake-build.log 2>&1 || { tail -50 /tmp/cmake-build.log; exit 1; })
            export PATH=/tmp/cmake/bin:$PATH
            cmake --version
            mkdir build
            cd build
            cmake -DSITE:STRING="sol" -DBUILDNAME:STRING="r" -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" -DCTEST_DROP_LOCATION_INIT:STRING="/submit.php?project=HDF5" -DCMAKE_BUILD_TYPE=Release  ..
#            ctest -D Experimental -C Release
