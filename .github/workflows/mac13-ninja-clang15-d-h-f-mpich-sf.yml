name: mac-13 ninja d mpich cl f h sf

on:
  push:
    branches:
      - develop
jobs:
  build:
    name: mac-13 ninja d mpich cl f h sf
    runs-on: macos-13

    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: get
      run: |
        curl -O -L  https://github.com/macports/macports-base/releases/download/v2.11.5/MacPorts-2.11.5-13-Ventura.pkg
    - name: install
      run: |
        sudo installer -pkg MacPorts-2.11.5-14-Sonoma.pkg -target /
    - name: update
      run: |
        export PATH=/opt/local/bin:/opt/local/sbin:$PATH
        ls -l /opt/local/bin
        ls -l /opt/local/sbin
        sudo port selfupdate
    - name: mpich
      run: |
        export PATH=/opt/local/bin:/opt/local/sbin:$PATH
        port version
        sudo port install mpich-clang
        sudo port select --set mpi mpich-clang-fortran
    - name: test
      run: |
        mkdir build
        cd build
        cmake -G Ninja \
        -DCMAKE_BUILD_TYPE=Debug \
        -DCMAKE_C_COMPILER=mpicc -DCMAKE_Fortran_COMPILER=mpifort \
        -DHDF5_BUILD_CPP_LIB:BOOL=OFF \
        -DHDF5_BUILD_JAVA:BOOL= ON \
        -DHDF5_BUILD_FORTRAN:BOOL=ON \
        -DHDF5_BUILD_HL_LIB:BOOL=ON \
        -DHDF5_ENABLE_ALL_WARNINGS=ON \
        -DHDF5_ENABLE_PARALLEL:BOOL=ON \
        -DHDF5_ENABLE_THREADSAFE:BOOL=OFF \
        -DHDF5_ENABLE_SUBFILING_VFD:BOOL=ON \
        -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
        -DMPIEXEC_MAX_NUMPROCS:STRING=3 \
        ..
        ctest -T Build
        ctest -C Debug -T Build
