name: amd64 mac-15 ninja cl-23 fl-23

on:
  push:
    branches: develop
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: install
        run: |
          brew update
          brew install flang llvm
      - name: checkout
        uses: actions/checkout@v6.0.0
      - name: test
        run: |
          ls /usr/local/bin/flang*
          export FC=$(brew --prefix flang)/bin/flang
          export CC=$(brew --prefix llvm)/bin/clang
          export CXX=$(brew --prefix llvm)/bin/clang++
          # CMake has no Darwin LLVMFlang rules, so it passes the macOS dylib
          # flags (-install_name, -current_version, -compatibility_version)
          # straight to flang, which rejects them. Wrap flang to forward them
          # to the linker with -Wl.
          REAL_FC="$FC"
          FC="$RUNNER_TEMP/flang-wrapper"
          cat > "$FC" <<EOS
          #!/bin/bash
          args=()
          while [ \$# -gt 0 ]; do
            case "\$1" in
              -current_version|-compatibility_version|-install_name)
                args+=("-Wl,\$1,\$2"); shift 2 ;;
              *) args+=("\$1"); shift ;;
            esac
          done
          exec "$REAL_FC" "\${args[@]}"
          EOS
          chmod +x "$FC"
          export FC
          mkdir build
          cd build
          cmake -G Ninja \
            -DSITE:STRING=mac-15.x86_64 \
            -DBUILDNAME:STRING="ninja/cl-23/fl-23" \
            -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
            -DCTEST_DROP_LOCATION_INIT="/submit.php?project=HDF5" \
            -DHDF5_BUILD_FORTRAN=ON \
            ..
          ctest -D Experimental
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

