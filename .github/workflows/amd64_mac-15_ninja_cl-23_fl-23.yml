name: amd64 mac-15 ninja cl-23 fl-23

on:
  push:
    branches: develop
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: install
        run: |
          brew update
          brew install flang llvm
      - name: checkout
        uses: actions/checkout@v6.0.0
      - name: test
        run: |
          ls /usr/local/bin/flang*
          export FC=$(brew --prefix flang)/bin/flang
          export CC=$(brew --prefix llvm)/bin/clang
          export CXX=$(brew --prefix llvm)/bin/clang++
          # CMake has no Darwin-LLVMFlang-Fortran rules, so it passes the
          # macOS dylib flags (-install_name, -current_version,
          # -compatibility_version) straight to flang, which rejects them.
          # Pass them through to the linker with -Wl instead.
          cat > "$RUNNER_TEMP/flang-darwin.cmake" <<'CMK'
          set(CMAKE_Fortran_OSX_COMPATIBILITY_VERSION_FLAG "-Wl,-compatibility_version,")
          set(CMAKE_Fortran_OSX_CURRENT_VERSION_FLAG "-Wl,-current_version,")
          set(CMAKE_Fortran_CREATE_SHARED_LIBRARY "<CMAKE_Fortran_COMPILER> <LANGUAGE_COMPILE_FLAGS> <LINK_FLAGS> -o <TARGET> -Wl,-install_name,<TARGET_INSTALLNAME_DIR><TARGET_SONAME> <OBJECTS> <LINK_LIBRARIES>")
          CMK
          mkdir build
          cd build
          cmake -G Ninja \
            -DCMAKE_USER_MAKE_RULES_OVERRIDE_Fortran="$RUNNER_TEMP/flang-darwin.cmake" \
            -DSITE:STRING=mac-15.x86_64 \
            -DBUILDNAME:STRING="ninja/cl-23/fl-23" \
            -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
            -DCTEST_DROP_LOCATION_INIT="/submit.php?project=HDF5" \
            -DHDF5_BUILD_FORTRAN=ON \
            ..
          ctest -D Experimental
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

